services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: obm
      POSTGRES_USER: obm
      POSTGRES_PASSWORD: obm_dev_pass_2024
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obm"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: node:22
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      - DATABASE_URL=postgres://obm:obm_dev_pass_2024@db:5432/obm
      - JWT_SECRET=dev_jwt_secret_change_me_in_prod
      - PORT=8000
    command: sh -c "npm install && node --watch src/index.js"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:5173"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend

volumes:
  pgdata:
  backend_node_modules:
  frontend_node_modules:
